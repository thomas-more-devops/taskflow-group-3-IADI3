<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding and responsive viewport so the app scales on phones and tablets -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Management App</title>
    <!-- Main stylesheet: layout, theme and animations live in styles/main.css -->
    <link rel="stylesheet" href="styles/main.css">
    <!-- Inter font from Google Fonts, used for all typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Root wrapper: centers the content and limits its maximum width -->
    <div class="container">
        <!-- ===== HEADER: app name and tagline ===== -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="icon">📋</span>
                    TaskFlow
                </h1>
                <p class="app-subtitle">Streamline your productivity</p>
            </div>
        </header>

        <!-- ===== MAIN: input form, task list and statistics ===== -->
        <main class="main">
            <!-- Task input: the text field and button are read by scripts/app.js via their ids -->
            <div class="task-input-section">
                <div class="input-container">
                    <input type="text" id="taskInput" placeholder="Enter your task here..." class="task-input">
                    <button id="addTaskBtn" class="add-btn">
                        <span class="add-icon">+</span>
                        Add Task
                    </button>
                </div>
            </div>

            <!-- Task list: header with counter, the list itself and the empty state -->
            <div class="tasks-section">
                <div class="tasks-header">
                    <h2>Your Tasks</h2>
                    <!-- Updated by JavaScript every time a task is added or removed -->
                    <span id="taskCount" class="task-count">0 tasks</span>
                </div>
                <div id="tasksList" class="tasks-list">
                    <!-- Tasks will be dynamically added here -->
                </div>
                <!-- Shown by JavaScript only when there are no tasks -->
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">✨</div>
                    <h3>No tasks yet</h3>
                    <p>Add your first task above to get started!</p>
                </div>
            </div>

            <!-- Statistics: three counters recalculated by JavaScript after each change -->
            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-number" id="totalTasks">0</span>
                        <span class="stat-label">Total Tasks</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="completedTasks">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="pendingTasks">0</span>
                        <span class="stat-label">Pending</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <p>&copy; 2024 TaskFlow. Built with HTML, CSS, and JavaScript.</p>
        </footer>
    </div>

    <!-- Application logic, loaded last so every element above already exists in the DOM -->
    <script src="scripts/app.js"></script>
</body>
</html>
